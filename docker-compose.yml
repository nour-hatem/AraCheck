version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=$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
    volumes:
      - ./backend:/app

  frontend:
    build: ./AraCheck-frontend/AraCheck-frontend/frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
